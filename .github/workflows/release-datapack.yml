name: Release Datapacks

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ZIP archives for each datapack
        run: |
          mkdir -p dist
          cd datapacks
          for d in */; do
            dirname=${d%/}
            echo "archiving: $dirname"
            
            cd "$dirname"
            zip -r "../../dist/${dirname}.zip" . -x "*.git*" "*.github*" "*.DS_Store"
            cd ..
          done

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
